# keepmum.app/appcast.xml and keepmum.app/download, counted (src/index.js). The rest of
# keepmum.app is the GitHub Pages site and does not go through this Worker.
name = "keepmum-counts"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = false
# No __name() wrappers from the bundler: the dashboard's browser code is sent as written (dashboard.js).
keep_names = false
# The trailing * lets a query string through (the app's ?v=); the Worker checks the exact path and
# hands anything else to the site.
routes = [
  { pattern = "keepmum.app/appcast.xml*", zone_name = "keepmum.app" },
  { pattern = "keepmum.app/download*", zone_name = "keepmum.app" },
  { pattern = "keepmum.app/update/*", zone_name = "keepmum.app" },
  { pattern = "keepmum.app/stats*", zone_name = "keepmum.app" },
  { pattern = "keepmum.app/video/*", zone_name = "keepmum.app" },
]

# GitHub's download count of each release, noted every six hours.
[triggers]
crons = ["17 */6 * * *"]

# /stats: the Cloudflare Access application in front of it (worker/README.md, "Dashboard"). Empty:
# the dashboard refuses everyone.
[vars]
ACCESS_TEAM_DOMAIN = "blueandhack.cloudflareaccess.com"
ACCESS_AUD = "3100cf44ed30789ea4d0396f6584445bddff4baa22061d79d2bbc8ebe6a18ff9"

# /video/: the flow video (docs/video/flow.swift), too big to keep in git. From
# `npx wrangler r2 bucket create keepmum-media` (worker/README.md, "Video").
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "keepmum-media"

[[d1_databases]]
binding = "DB"
database_name = "keepmum-counts"
# From `npx wrangler d1 create keepmum-counts` (worker/README.md).
database_id = "3b38a92e-4fe0-45e4-b256-3612572d27cc"
