# Every tool each agent offers its model in the CI setup (e2e/ci.sh: pinned versions, dummy API keys,
# no user config), and what keepmum does with a value in its input. `--check-tools` fails a run on
# any tool not listed here: a new tool may run commands, write files or reach the network in a way
# keepmum does not know yet. Codex 0.147 moved every command into its code-mode `exec` tool, and
# keepmum restored real values into it unchecked until the e2e suite found it.
#
# A new tool: find out what it does, make sure keepmum handles it (restore.DEFAULT_POLICY for network
# tools, destinations.SHELL_TOOLS and codemode.CODE_TOOLS for commands), add a case if it can touch
# disk or network, then list it here. A tool no longer offered is only reported.
#
# Checked against Codex 0.147.0 and 0.167.0, Claude Code 2.1.310 and 2.1.319, the Antigravity CLI
# 1.5.3, pi 0.84.2 and opencode 2.2.6 on Nov 8, 2026, with the e2e stub MCP server configured (mcp-01). Tools a personal login adds (ChatGPT's image generation and
# connectors, claude.ai's) are not in CI and not listed.
#
# MCP tools are not listed: an agent names them `mcp__<server>__<tool>`, and keepmum holds every one
# to the server's [restore] setting ("own" by default). Codex's code mode does not even declare them
# to the model (they are "deferred": on the `tools` object, and in `ALL_TOOLS`).

[codex]
"exec" = "code mode: a JavaScript script calling the exec:* and MCP tools; each string literal gets what the nested tool it is passed to may receive, one it is not passed to straight only what every network tool the script calls may (codemode.py); values escaped for JavaScript"
"exec:exec_command" = "runs a shell command, from an exec script: destinations and commands checks, values quoted for the shell"
"exec:write_stdin" = "types into a running command, from an exec script: its text is read as a command"
"exec:apply_patch" = "writes files, from an exec script: values restored into the patch text"
"exec:update_plan" = "the plan the user sees (gone in 0.167): restored as text"
"exec:view_image" = "opens a local image by path: restored"
"exec:list_mcp_resources" = "lists an MCP server's resources: decided as that server's tool (no values in practice)"
"exec:list_mcp_resource_templates" = "lists an MCP server's resource templates: decided as that server's tool"
"exec:read_mcp_resource" = "reads a resource from the MCP server its `server` argument names: decided as that server's tool"
"exec:clock__curr_time" = "the current time (0.167): no values"
"exec:create_goal" = "starts Codex's goal for this thread, which the user sees (0.167): restored as text"
"exec:get_goal" = "reads that goal (0.167): no values"
"exec:update_goal" = "sets the goal's status (0.167): restored as text"
"wait" = "waits on a running exec script: no values"
"request_user_input" = "asks the user a question: restored"
"request_user_input_async" = "asks the user a question without waiting for the answer (0.167): restored"
"sleep" = "waits up to 12 hours or until new input (0.167): no values"
"spawn_agent" = "starts a sub-agent on this Mac, whose own requests go through keepmum: restored"
"send_message" = "a message to a sub-agent on this Mac: restored"
"followup_task" = "more work for a sub-agent on this Mac: restored"
"wait_agent" = "waits on a sub-agent: no values"
"list_agents" = "lists sub-agents: no values"
"interrupt_agent" = "stops a sub-agent: no values"

[claude]
"Bash" = "runs a shell command: destinations and commands checks, values quoted for the shell"
"Write" = "writes a file: restored; in a JSON file, escaped"
"Edit" = "edits a file: restored, so the text it replaces matches the file; in a JSON file, escaped"
"Read" = "reads a file by path: restored"
"Agent" = "starts a sub-agent on this Mac, whose own requests go through keepmum: restored"
"Skill" = "runs one of the user's skills on this Mac: restored"
"Workflow" = "runs a workflow of sub-agents on this Mac: restored"
"ScheduleWakeup" = "schedules this session to resume on this Mac: restored"
"ListAgents" = "lists agents on this Mac: no values"
"ReportFindings" = "shows review findings to the user: restored"
"ToolSearch" = "loads the schema of another tool: no values"
"DeferredToolPlaceholder" = "stands in for tools loaded later through ToolSearch: no values"

# The Antigravity CLI declares these 12 to its model, signed in with Google or through a gateway. Its
# stream-json `init` lists about 60 more (browser_*, read_url_content, call_mcp_tool, …) that it
# declares in other setups; restore.DEFAULT_POLICY keeps placeholders in those that act on the web.
[agy]
"run_command" = "runs a shell command (CommandLine): destinations and commands checks, values quoted for the shell"
"read_file" = "reads a local file by path: restored"
"write_file" = "writes a local file (Path, Content): restored"
"edit_file" = "replaces text in a local file (Target, Replacement): restored"
"search_web" = "a web search, asked of the model provider (Code Assist web_search, or the gateway): placeholders kept"
"manage_task" = "lists, reads or types into agy's background commands: restored (its Input is a running command's stdin)"
"send_message" = "a message to a sub-agent on this Mac, whose own requests go through keepmum: restored"
"schedule" = "a timer or cron job that prompts agy again later, on this Mac: restored"
"invoke_subagent" = "starts a sub-agent on this Mac, whose own requests go through keepmum: restored"
"define_subagent" = "defines a sub-agent type (name, prompt) on this Mac: restored"
"manage_subagents" = "lists or stops sub-agents: no values"
"swarm" = "manages agy's worker agents on this Mac (add, with a brief posted to the swarm's board; status, models, model, kill, title), each in this repository or its own copy of it; a worker's own requests go through keepmum, as invoke_subagent's do: restored (offered from Nov 12, 2026, without a new agy release)"
"ask_question" = "asks the user multiple-choice questions: restored"
"call_mcp_tool" = "calls an MCP server's tool (ServerName, ToolName, Arguments): decided as mcp__<server>__<tool> (tools.call_name), its result credited to that server"
"list_resources" = "lists an MCP server's resources (ServerName): decided as that server's tool"
"read_resource" = "reads a resource from the MCP server its ServerName names: decided as that server's tool"

[pi]
"bash" = "runs a shell command: destinations and commands checks, values quoted for the shell"
"read" = "reads a local file by path: restored"
"write" = "writes a local file (path, content): restored"
"edit" = "replaces text in a local file (edits: oldText, newText): restored"

# opencode 2.x reaches MCP servers only from `execute` (tools.<server>.<tool>), so MCP tools are
# never in its list; they are held to the server's setting there (codemode.py).
[opencode]
"shell" = "runs a shell command (command, workdir): destinations and commands checks, values quoted for the shell"
"read" = "reads a local file by path: restored"
"write" = "writes a local file (path, content): restored"
"edit" = "replaces text in a local file (oldString, newString): restored"
"glob" = "finds files by pattern on this Mac: restored"
"grep" = "searches files on this Mac: restored"
"execute" = "Code Mode: JavaScript calling MCP tools (tools.<server>.<tool>) and fetch; each literal gets what the call it is passed to may receive (mcp__<server>__<tool>, webfetch keeps placeholders), one passed to none only what every network call there may"
"webfetch" = "fetches a URL from this Mac: placeholders kept"
"websearch" = "a web search: placeholders kept"
"subagent" = "starts a sub-agent on this Mac, whose own requests go through keepmum: restored"
"question" = "asks the user questions: restored"
"skill" = "loads a skill by id: restored"
"experimental_image_generate" = "makes an image from a prompt at a service that may be reached around keepmum: placeholders kept"
