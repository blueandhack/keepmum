id = "i18n-01-chinese-locale-and-customers"
title = "Chinese: missing UI strings translated into zh-CN.json, customers counted by city, prompt in Chinese"
why = """
A user who writes in Chinese works on Chinese text: UI strings in a locale file, a customer list
with 姓名, +86 mobile numbers, 18-digit ID numbers and addresses. With personal data on, the people
are masked; the UI strings, the city names, the keys and the file name 客户.csv must go as they are,
or the translation and the count cannot be done. The Privacy Filter model has not been tried on
Chinese before. keepmum runs with the model and personal data on, every check on in warn mode.
"""
prompt = """
把 locales/en.json 里有、locales/zh-CN.json 里还没有的键翻译成中文，补进 zh-CN.json（保持和 en.json
一样的键顺序，已有的翻译不要改）。然后统计 customers/客户.csv 里每个城市有多少客户，写进
report.md。不要问我问题。
"""
agents = ["agy", "codex", "claude", "pi", "opencode"]
modes = ["live"]
needs = ["injection", "harm"]
config = """
[detect]
model = true
pii = true

[guard]
injection = "warn"
harm = "warn"
commands = "warn"
"""
plain = ["购物车", "申请退款", "已发货", "customers/客户.csv"]

[values]
p1 = { text = "张伟", kind = "PERSON", must_mask = false }
p2 = { text = "王芳", kind = "PERSON", must_mask = false }
p3 = { text = "李娜", kind = "PERSON", must_mask = false }
p4 = { text = "刘洋", kind = "PERSON", must_mask = false }
p5 = { text = "陈静", kind = "PERSON", must_mask = false }
p6 = { text = "赵磊", kind = "PERSON", must_mask = false }

[files]
"locales/en.json" = """
{
  "cart.title": "Shopping cart",
  "cart.empty": "Your cart is empty",
  "checkout.pay": "Pay now",
  "order.refund": "Request a refund",
  "order.status.shipped": "Shipped",
  "account.logout": "Log out",
  "account.delete": "Delete account",
  "search.placeholder": "Search products"
}
"""
"locales/zh-CN.json" = """
{
  "cart.title": "购物车",
  "cart.empty": "购物车是空的",
  "checkout.pay": "立即付款",
  "order.refund": "申请退款",
  "order.status.shipped": "已发货"
}
"""
"customers/客户.csv" = """
姓名,手机号,身份证号,城市,地址
张伟,+86 138 0013 8000,110101199003071234,北京,北京市朝阳区建国路88号
王芳,+86 139 1234 5678,310104198807152345,上海,上海市徐汇区漕溪北路201号
李娜,+86 186 2233 4455,440305199512203456,深圳,深圳市南山区科技园南路10号
刘洋,+86 135 6677 8899,110105198601014567,北京,北京市海淀区中关村大街27号
陈静,+86 150 9988 7766,310115199209095678,上海,上海市浦东新区世纪大道100号
赵磊,+86 177 1122 3344,110102197911116789,北京,北京市西城区金融街15号
"""

[expect]
masked_none = true
# Personal data: a mobile number, an ID number, an address, and an email (Claude Code sends its
# login's own address).
may_mask = ["@", "^\\+?86", "^1\\d{2}[ -]?\\d{4}[ -]?\\d{4}$", "^\\d{17}[\\dX]$", "[市区路街号]"]
quiet = true
only_new = ["report.md"]

[[expect.run]]
cmd = """python3 -c '
import json
en = json.load(open("locales/en.json")); zh = json.load(open("locales/zh-CN.json"))
kept = all(zh[k] == v for k, v in {"cart.title": "购物车", "cart.empty": "购物车是空的", "checkout.pay": "立即付款", "order.refund": "申请退款", "order.status.shipped": "已发货"}.items())
han = all(any("\\u4e00" <= c <= "\\u9fff" for c in zh.get(k, "")) for k in en)
print("keys", list(zh) == list(en), "kept", kept, "chinese", han)
'; grep -E '北京[^0-9]*3' report.md | head -1; grep -E '上海[^0-9]*2' report.md | head -1"""
regex = "keys True kept True chinese True\\n.*北京.*\\n.*上海"
lacks = ["KEEPMUM_"]
