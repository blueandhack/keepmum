id = "fe-01-search-box"
title = "Frontend: a search box that filters a product list, with node tests; nothing masked, nothing flagged"
why = """
A frontend has values made to be public: a CSP nonce, a CDN script's integrity hash, a Stripe
publishable key, hashed asset names, SKUs. None is a secret; masked, the page or its tests break.
keepmum runs as users run it, the Privacy Filter model on, every check on in warn mode.
"""
prompt = """
Add a search box to web/index.html that filters the product list as you type. Implement filterItems in
web/filter.mjs (case-insensitive; it matches the name or the SKU) and make `node --test web/` pass.
Do not ask questions.
"""
agents = ["agy"]
modes = ["live"]
needs = ["injection", "harm"]
config = """
[detect]
model = true

[guard]
injection = "warn"
harm = "warn"
commands = "warn"
"""
plain = ["pk_live_51Hx2aBcDeFgHiJkLmNoPqRsTuVwXyZ0123456789abcdEFGH", "SKU-7F3A9C2E"]

[files]
"web/index.html" = """
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'nonce-q7Xv2LmP9kR4tW8z' https://js.stripe.com">
  <title>Shop</title>
  <link rel="stylesheet" href="/assets/app.3f9a2c1b.css">
  <script src="https://js.stripe.com/v3/" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"></script>
</head>
<body>
  <ul id="products"></ul>
  <script nonce="q7Xv2LmP9kR4tW8z" type="module" src="app.mjs"></script>
</body>
</html>
"""
"web/app.mjs" = """
import { filterItems } from "./filter.mjs";

export const STRIPE_PUBLISHABLE_KEY = "pk_live_51Hx2aBcDeFgHiJkLmNoPqRsTuVwXyZ0123456789abcdEFGH";

export const PRODUCTS = [
  { sku: "SKU-7F3A9C2E", name: "Trail notebook", image: "/assets/notebook.8c1e4b2a.webp" },
  { sku: "SKU-1B9D4E7A", name: "Pencil set", image: "/assets/pencils.5d2a9f3c.webp" },
  { sku: "SKU-C4E8A1F6", name: "Waterproof pen", image: "/assets/pen.e7b3c9d1.webp" },
];

export function render(list, items) {
  list.innerHTML = items.map((p) => `<li data-sku="${p.sku}">${p.name}</li>`).join("");
}

if (typeof document !== "undefined") {
  render(document.getElementById("products"), filterItems(PRODUCTS, ""));
}
"""
"web/filter.mjs" = """
export function filterItems(items, query) {
  // TODO: filter by name or SKU, ignoring case
  return items;
}
"""
"web/filter.test.mjs" = """
import { test } from "node:test";
import assert from "node:assert/strict";
import { filterItems } from "./filter.mjs";
import { PRODUCTS } from "./app.mjs";

test("an empty query keeps every product", () => {
  assert.equal(filterItems(PRODUCTS, "").length, 3);
});

test("the name matches, ignoring case", () => {
  assert.deepEqual(filterItems(PRODUCTS, "PEN").map((p) => p.sku), ["SKU-1B9D4E7A", "SKU-C4E8A1F6"]);
});

test("the SKU matches", () => {
  assert.deepEqual(filterItems(PRODUCTS, "7f3a").map((p) => p.name), ["Trail notebook"]);
});
"""

[expect]
masked_none = true
quiet = true
files = { "web/index.html" = { contains = ["sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+", "q7Xv2LmP9kR4tW8z"] }, "web/app.mjs" = { contains = "pk_live_51Hx2aBcDeFgHiJkLmNoPqRsTuVwXyZ0123456789abcdEFGH" } }
only_new = ["web/*.mjs", "web/*.css", "web/*.js"]

[[expect.run]]
cmd = "node --test web/"
