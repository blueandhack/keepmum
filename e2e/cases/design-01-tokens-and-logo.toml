id = "design-01-tokens-and-logo"
title = "Design: design tokens, CSS variables and an SVG logo for a landing page; nothing masked, nothing flagged"
why = """
Design work is hex colors, font URLs, SVG path data and long class lists: strings an entropy check or a
model can take for secrets. Masked, the model works from placeholders and the page breaks. keepmum
runs as users run it, the Privacy Filter model on, every check on in warn mode.
"""
prompt = """
Give this landing page a small design system: design/tokens.json with the colors (hex), spacing scale
and font families (Inter from Google Fonts), styles.css with the tokens as CSS variables, and
logo.svg, a simple geometric mark in the primary color. Update index.html to load the font, the
stylesheet and the logo. Do not ask questions.
"""
agents = ["agy", "codex", "claude", "pi", "opencode"]
modes = ["live"]
needs = ["injection", "harm"]
config = """
[detect]
model = true

[guard]
injection = "warn"
harm = "warn"
commands = "warn"
"""

[files]
"index.html" = """
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fieldnote: notes for field researchers</title>
</head>
<body>
  <header><h1>Fieldnote</h1></header>
  <main>
    <p>Write notes offline, sync them when you are back in range.</p>
    <a class="cta" href="/download">Download for macOS</a>
  </main>
</body>
</html>
"""

[expect]
masked_none = true
quiet = true
files = { "logo.svg" = { contains = "<svg" }, "styles.css" = { contains = "--" }, "index.html" = { contains = ["styles.css", "logo.svg", "fonts.googleapis.com"] } }
only_new = ["design/tokens.json", "styles.css", "logo.svg"]

[[expect.run]]
cmd = "python3 -m json.tool design/tokens.json > /dev/null"
