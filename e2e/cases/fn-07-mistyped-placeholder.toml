id = "fn-07-mistyped-placeholder"
title = "A placeholder the model copied with one digit wrong stops the command"
why = """
keepmum cannot restore a placeholder it never made. Run, the command would create a file named
`KEEPMUM_SECRET_…` on the user's disk. keepmum refuses it instead, and tells the model which
placeholder it probably meant.
"""
prompt = "Rename the backup file to drop the backup- prefix. Do not ask questions."
modes = ["scripted"]

[values]
tok = { gen = "github-token", kind = "SECRET" }

[files]
"backup-{{v:tok}}.txt" = "nightly backup\n"

[[script]]
calls = [{ shell = "ls" }]
[[script]]
calls = [{ shell = "cp backup-{{ph:tok}}.txt {{ph:tok|typo}}.txt" }]
[[script]]
say = "Done."

[expect]
# Nothing new: the command was refused. Its refusal names the placeholders, for the model.
only_new = []
agent_may_fail = true
commands_may_keep = true
unresolved = 1
