id = "web-01-person-to-search"
title = "The agent searches the web for a person named in a file; the search gets the placeholder"
why = """
A web search runs on the provider's side or the search engine's, never on this Mac: what goes into
it leaves. keepmum keeps placeholders in web tools (Claude Code's WebSearch and WebFetch), Codex's
web_search runs at OpenAI, and Antigravity's search_web is a Code Assist call keepmum scans: in
each, a masked name is searched as its placeholder, never as the name. The note the
agent writes on disk still gets the real name.
"""
# The agents with a web search: pi has none (a model asked to search runs curl, a shell command
# keepmum gives real values, as any command run on this Mac), and opencode 2.x searches only through a
# provider the user sets up (none: it asks, and a headless run cancels). opencode's fetch is web-02.
agents = ["codex", "claude", "agy"]
modes = ["live"]
prompt = """
clients/brief.md names our new client. Search the web for that person's name to find a public
profile, then write clients/research.md: a first line "# Research: " followed by the client's name,
then one sentence on what the search found (it is fine if it found nothing). Do not ask questions.
"""
config = "[detect]\nmodel = true\npii = true\n"


[values]
person = { text = "Margaret Thornbury", kind = "PERSON" }

[files]
"clients/brief.md" = "# New client\n\nClient: Margaret Thornbury\nStarts: next month.\n"

[expect]
masked = ["person"]
# Searched as its placeholder, the name can find keepmum's own pages, whose text holds an example
# placeholder (KEEPMUM_SECRET_7f3a9c2e) that is not this run's: keepmum rightly leaves it as written,
# which is not a placeholder it failed to restore. Found in the 0.1.0a7 release check.
foreign_placeholders = true
web_calls_min = 1
files = { "clients/research.md" = { contains = "# Research: Margaret Thornbury" } }
only_new = ["clients/research.md"]
