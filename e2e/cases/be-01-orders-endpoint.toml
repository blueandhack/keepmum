[expect]
masked_none = true
quiet = true
answer_contains = ["c2a8e4f1-6b3d-4a9e-8f72-1d5b9c0e3a47"]
# The route may be matched any way (opencode split the path): the test run below proves it.
only_new = ["tests/test_orders.py", "*__pycache__*"]

[[expect.run]]
cmd = "python3 -m unittest -v"
contains = "test_orders"
