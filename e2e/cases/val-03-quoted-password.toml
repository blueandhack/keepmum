id = "val-03-quoted-password"
title = "Quoted passwords with spaces or quotes in .env never leave the Mac"
why = """
`DB_PASSWORD="p@ss w0rd $HOME!"` is not masked at all, and `Tr0ub4dor"&\\3x` only up to its quote:
the rest goes to the provider.
"""
prompt = "Which variables does .env set? Name them, without their values. Do not ask questions."

[values]
spaced = { text = "p@ss w0rd $HOME!", kind = "SECRET" }
quoted = { text = "Tr0ub4dor\"&\\3x", kind = "SECRET" }

[files]
".env" = "DB_PASSWORD=\"{{v:spaced}}\"\nADMIN_PASSWORD={{v:quoted}}\n"

[[script]]
calls = [{ read = ".env" }]
[[script]]
say = "It sets DB_PASSWORD and ADMIN_PASSWORD."

[expect]
answer_contains = ["DB_PASSWORD", "ADMIN_PASSWORD"]
