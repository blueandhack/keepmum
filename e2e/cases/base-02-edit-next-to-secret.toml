id = "base-02-edit-next-to-secret"
title = "A line next to a token is edited in place; the token stays as it was"
why = """
An edit names the lines it replaces. The model writes them with the placeholder; restored, they must
match the file byte for byte, or the edit fails or lands in the wrong place.
"""
prompt = """
In config.yaml, change the org from acme to globex. Change nothing else. Do not ask questions.
"""


[values]
tok = { gen = "github-token", kind = "SECRET" }

[files]
"config.yaml" = "github:\n  token: {{v:tok}}\n  org: acme\n"

[[script]]
calls = [{ read = "config.yaml" }]
[[script]]
calls = [{ edit = "config.yaml", old = "  token: {{ph:tok}}\n  org: acme", new = "  token: {{ph:tok}}\n  org: globex" }]
[[script]]
say = "Changed the org to globex."

[expect]
masked = ["tok"]
files = { "config.yaml" = "github:\n  token: {{v:tok}}\n  org: globex\n" }
only_new = []
