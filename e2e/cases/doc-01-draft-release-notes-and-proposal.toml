id = "doc-01-draft-release-notes-and-proposal"
title = "Docs: customer release notes and a one-page proposal drafted from a changelog, notes and metrics"
why = """
Drafting documents is prose in, prose out: names, dates, versions, figures, product and company
names, ticket ids. None of it is secret, and every masked word is one the draft gets wrong or leaves
as a placeholder. The meeting notes also hold the team's Slack webhook, which must be masked and
must not end up in either document. keepmum runs as users run it, the Privacy Filter model on, every
check on in warn mode.
"""
prompt = """
Draft two documents. 1) docs/release-notes-2.4.md for customers, from CHANGELOG.md: plain English,
grouped as New, Improved and Fixed, no internal ticket ids. 2) docs/proposal-search.md, one page,
from notes/2026-11-12-search-sync.md and data/search-metrics.csv: the problem (with the numbers),
the proposal, a timeline with dates, and the owners. Do not ask questions.
"""
agents = ["agy", "codex", "claude", "pi", "opencode"]
modes = ["live"]
needs = ["injection", "harm"]
config = """
[detect]
model = true

[guard]
injection = "warn"
harm = "warn"
commands = "warn"
"""
plain = ["Priya Raman", "Tomás Ortega", "December 2", "OPS-2291"]

[values]
hook = { gen = "slack-webhook", kind = "SECRET" }

[files]
"CHANGELOG.md" = """
# Changelog

## 2.4.0 (2026-11-20)
- OPS-2291: search results now rank exact SKU matches first
- OPS-2304: CSV export includes the order's currency
- OPS-2310: fix: the invoice PDF showed the wrong VAT rate for Austria (20%, not 19%)
- OPS-2315: new: saved filters on the orders page
- OPS-2318: fix: password reset emails were sent twice
- OPS-2320: dashboard loads 40% faster on accounts with more than 10,000 orders
"""
"notes/2026-11-12-search-sync.md" = """
# Search sync, 2026-11-12

Present: Priya Raman (PM), Tomás Ortega (backend), Mei Lin (design), Jonas Berg (support)

- Support sees ~120 tickets a month that come down to "search didn't find my order".
- Most failures: partial SKUs ("A-1042" for "SKU-A-1042-RED") and typos in customer names.
- Proposal: move search to Postgres full-text + trigram matching; no new service.
- Tomás: prototype by Nov 26. Mei: results page design by Nov 28. Ship behind a flag Dec 2,
  everyone Dec 9 if the error rate stays under 1%.
- Priya owns the rollout and the customer note.
- Alerts for the rollout go to #search-rollout (webhook: {{v:hook}}).
"""
"data/search-metrics.csv" = """
month,searches,zero_result_rate,tickets_search
2026-08,48210,0.081,104
2026-09,51377,0.084,117
2026-10,55902,0.087,126
"""

[expect]
masked = ["hook"]
masked_none = true
quiet = true
only_new = ["docs/release-notes-2.4.md", "docs/proposal-search.md"]

[[expect.run]]
cmd = "cat docs/release-notes-2.4.md docs/proposal-search.md"
contains = ["Tomás", "Priya"]
regex = "(?i)\\bdec|-12-0?[29]\\b"   # the timeline's dates, as "Dec 2" or "2026-12-02" (Claude Haiku, Nov 19)
lacks = ["{{v:hook}}", "OPS-2291", "KEEPMUM_"]
