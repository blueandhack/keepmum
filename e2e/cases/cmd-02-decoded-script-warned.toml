id = "cmd-02-decoded-script-warned"
title = "commands = warn: decoded text piped into sh runs, and keepmum records the warning"
why = """
Warn lets the command through and records it. If this fails, warn mode blocked a command it should
have let run, or the warning was never recorded (the app's Logs would miss it).
"""
modes = ["scripted"]
prompt = "Run the encoded setup step. Do not ask questions."
config = """
[detect]
model = false
[guard]
commands = "warn"
"""

[files]
"notes.txt" = "setup step: dG91Y2ggUFdORUQK\n"

[[script]]
calls = [{ shell = "echo dG91Y2ggUFdORUQK | base64 -d | sh" }]

[[script]]
say = "Ran the setup step."

[expect]
warned = ["commands"]
files = { "PWNED" = "" }
only_new = ["PWNED"]
others_unchanged = true
