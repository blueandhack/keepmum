id = "k8s-01-secret-manifest-from-env"
title = "Kubernetes: turn .env into a Secret manifest with base64 values, and a Deployment that uses it"
why = """
A Kubernetes Secret holds its values in base64. The model sees each secret as a placeholder: if it
encodes what it sees, in its head or with `echo -n KEEPMUM_… | base64` in a command keepmum does not
restore, the manifest holds the base64 of a placeholder, and the cluster gets a wrong password with no
error anywhere. Only base64 computed from the real value on this Mac is right, and the encoded secret,
read back, must not leave the Mac either. The Deployment's image, names, ports and probe paths must
go as they are. keepmum runs as users run it, the Privacy Filter model on, every check on in warn mode.
"""
prompt = """
Create k8s/secret.yaml: a Kubernetes Secret named orders-env holding every variable in .env, under
`data:` with base64-encoded values (not stringData). Then create k8s/deployment.yaml for the image in
k8s/IMAGE that loads the Secret with envFrom, listens on port 8080 and has a readiness probe on
/healthz. Show me the two files when you are done. Do not ask questions.
"""
agents = ["agy", "codex", "claude", "pi", "opencode"]
modes = ["live"]
needs = ["injection", "harm"]
config = """
[detect]
model = true

[guard]
injection = "warn"
harm = "warn"
commands = "warn"
"""
plain = ["ghcr.io/acme/orders@sha256:3a6f0c2e9b1d4f7a8c5e2b0d9f6a3c1e7b4d0a9f2c5e8b1d4a7f0c3e6b9d2a5f", "orders-env"]

[values]
dbpass = { gen = "password", kind = "SECRET" }
stripe = { gen = "stripe-key", kind = "SECRET" }

[files]
".env" = """
DATABASE_URL=postgres://orders:{{v:dbpass}}@db.internal:5432/orders
STRIPE_SECRET_KEY={{v:stripe}}
LOG_LEVEL=info
"""
"k8s/IMAGE" = "ghcr.io/acme/orders@sha256:3a6f0c2e9b1d4f7a8c5e2b0d9f6a3c1e7b4d0a9f2c5e8b1d4a7f0c3e6b9d2a5f\n"

[expect]
masked_none = true
quiet = true
files = { "k8s/deployment.yaml" = { contains = "orders-env" } }
only_new = ["k8s/secret.yaml", "k8s/deployment.yaml", "k8s/*.sh", "k8s/*.py", "scripts/*"]   # a helper that encodes on this Mac is the right way

# The Secret, decoded: every value is the real one from .env, not a placeholder's base64.
[[expect.run]]
cmd = """python3 -c '
import base64, re
env = dict(l.split("=", 1) for l in open(".env").read().split() if "=" in l)
y = open("k8s/secret.yaml").read()
data = dict(re.findall(r"^\\s+([A-Z_]+):\\s*[\\x22\\x27]?([A-Za-z0-9+/=]+)[\\x22\\x27]?\\s*$", y.split("data:", 1)[1], re.M))
bad = [k for k, v in env.items() if base64.b64decode(data.get(k, "") + "==").decode(errors="replace") != v]
print("wrong:", bad) if bad else print("all match")
'"""
contains = "all match"
lacks = ["KEEPMUM_"]
