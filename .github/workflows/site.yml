name: Site

# Publishes site/ to GitHub Pages (keepmum.app), with the docs built into site/docs/ (docs-site/).
# Static files, with one step: the newest release in
# mac/appcast.xml (version and build time) goes under the download buttons, so pushing the feed
# updates the site too.
on:
  push:
    branches: [main]
    paths: ["site/**", "docs-site/**", "mac/docs/**", "mac/appcast.xml", "mac/appcast-github.xml", ".github/scripts/site_release.py", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Built and uploaded in one job, deployed in the next, as GitHub's own Pages workflow does: in one
  # job, deploy-pages asked for the artifact under a second after it was uploaded and found none, three
  # runs in a row (Nov 24), and a re-run of the job then found two.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # each docs page's "Last updated" is its last commit
      - run: python3 .github/scripts/site_release.py
      # keepmum.app/docs: Starlight, from the Markdown in docs-site/, built into site/docs/.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: The docs
        working-directory: docs-site
        run: |
          npm ci
          npm run build
      # keepmum.app/appcast.xml for installed apps when the Worker is gone or skips them: the signed
      # copy of the feed whose downloads come straight from GitHub (mac/appcast.py). While the Worker
      # runs, it answers that path and this file is never served. Unsigned, it would be refused.
      - name: The update feed, for when the Worker is gone
        run: |
          if grep -q "sparkle-signatures:" mac/appcast-github.xml 2>/dev/null; then
            cp mac/appcast-github.xml site/appcast.xml
            echo "site/appcast.xml: the signed feed, downloads from GitHub"
          else
            echo "::warning::mac/appcast-github.xml is not signed (sign_update, or the next release.sh), so keepmum.app has no feed of its own if the Worker goes"
          fi
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
