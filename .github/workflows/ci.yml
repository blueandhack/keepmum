name: CI

# Skipped when a change only touches the website or the docs: nothing it tests or builds changed.
on:
  push:
    branches: [main]
    paths-ignore: ["site/**", "docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["site/**", "docs/**", "**/*.md"]

permissions:
  contents: read

jobs:
  python:
    # No ML packages: tests that need pf-serve and the model skip themselves. Linux: nothing it tests
    # is macOS-only (the Mac app builds in mac-app.yml), and Linux runners are free for public repositories.
    runs-on: ubuntu-24.04-arm
    env:
      UV_PYTHON: "3.15"  # the newest Python; keepmum supports 3.12 and later (pyproject.toml)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --frozen
      # The tests, measured: statement and branch coverage over src/keepmum, which fails the job below
      # fail_under in pyproject.toml. sys.monitoring keeps it fast (branches need Python 3.14 or later).
      - run: uv run --frozen coverage run -m pytest -q
        env:
          COVERAGE_CORE: sysmon
      - name: Coverage
        run: |
          uv run --frozen coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true
          uv run --frozen coverage report

  agents:
    # The e2e suite (e2e/README.md): the real Codex, Claude Code, Antigravity CLI, pi and opencode through keepmum,
    # answered by a scripted model and signed in with dummy keys, so no secret is needed (e2e/ci.sh). The agents
    # are pinned: an update can change how they call tools, which should arrive as its own change,
    # not as a failure on an unrelated one. Cases that need the model skip themselves. On Linux, the
    # agents' own Linux builds: Claude Code's and Codex's sandboxes use bubblewrap there.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      UV_PYTHON: "3.15"
      CODEX_VERSION: 0.167.0
      CLAUDE_CODE_VERSION: 2.1.319
      PI_VERSION: 1.5.0
      # opencode 2.x is not on npm: its GitHub release, checked against the digest GitHub records.
      OPENCODE_VERSION: 2.2.6
      OPENCODE_SHA256: f2d27600c367e45057d6a16f6a5c2aa8d77b41a9b10d4bc3d849c2f88870e944
      # The Antigravity CLI's own installer only installs the latest: the release is pinned by its
      # URL (from https://antigravity-cli-auto-updater-974169037036.us-central1.run.app/manifests/linux_arm64.json)
      # and that manifest's SHA-512.
      AGY_VERSION: 1.5.3
      AGY_URL: https://storage.googleapis.com/antigravity-public/antigravity-cli/1.5.3-6604829099950080/linux-arm/cli_linux_arm64.tar.gz
      AGY_SHA512: c2fac818b3c1bb224079df03a714ccba99728b6a3a41d86d247ab2feb8582a43840c5032f1c2b75e72667623d5503e7ffda2712c4f37b6ee19f99c3fcfb25bae
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --frozen
      - name: Install the agents
        run: |
          # Ubuntu 24.04 keeps unprivileged user namespaces from bubblewrap unless this is off.
          sudo apt-get install -y -qq bubblewrap socat
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          node --version
          npm install --no-fund --no-audit --prefix "$RUNNER_TEMP/agents" \
            "@openai/codex@$CODEX_VERSION" "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION" \
            "@earendil-works/pi-coding-agent@$PI_VERSION"
          echo "$RUNNER_TEMP/agents/node_modules/.bin" >> "$GITHUB_PATH"
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/agy.tar.gz" "$AGY_URL"
          echo "$AGY_SHA512  $RUNNER_TEMP/agy.tar.gz" | sha512sum -c -
          mkdir -p "$RUNNER_TEMP/agy"
          tar -xzf "$RUNNER_TEMP/agy.tar.gz" -C "$RUNNER_TEMP/agy"
          mv "$RUNNER_TEMP/agy/antigravity" "$RUNNER_TEMP/agy/agy"
          echo "$RUNNER_TEMP/agy" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/agy/agy" --version | grep -qx "$AGY_VERSION"
          # Through the API (gh), not the release-download URL, which answered 504 for minutes at a time.
          for try in 1 2 3 4 5; do
            gh release download "v$OPENCODE_VERSION" --repo anomalyco/opencode --pattern opencode-linux-arm64.tar.gz \
              --dir "$RUNNER_TEMP" --clobber && break
            [ "$try" = 5 ] && exit 1; sleep $((try * 10))
          done
          echo "$OPENCODE_SHA256  $RUNNER_TEMP/opencode-linux-arm64.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/opencode"
          tar -xzf "$RUNNER_TEMP/opencode-linux-arm64.tar.gz" -C "$RUNNER_TEMP/opencode"
          echo "$RUNNER_TEMP/opencode" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/opencode/opencode" --version | grep -q "$OPENCODE_VERSION"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: e2e/ci.sh
