name: CI

# Skipped when a change only touches the website or the docs: nothing it tests or builds changed.
on:
  push:
    branches: [main]
    paths-ignore: ["site/**", "docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["site/**", "docs/**", "**/*.md"]

permissions:
  contents: read

jobs:
  python:
    # No ML packages: tests that need pf-serve and the model skip themselves.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --frozen
      - run: uv run --frozen pytest -q

  agents:
    # The e2e suite (e2e/README.md): the real Codex, Claude Code, Antigravity CLI, pi and opencode through keepmum,
    # answered by a scripted model and signed in with dummy keys, so no secret is needed (e2e/ci.sh). The agents
    # are pinned: an update can change how they call tools, which should arrive as its own change,
    # not as a failure on an unrelated one. Cases that need the model skip themselves.
    runs-on: macos-26
    timeout-minutes: 20
    env:
      CODEX_VERSION: 0.147.0
      CLAUDE_CODE_VERSION: 2.1.310
      PI_VERSION: 0.84.2
      # opencode 2.x is not on npm: its GitHub release, checked against the digest GitHub records.
      OPENCODE_VERSION: 2.2.6
      OPENCODE_SHA256: 15491608f6b0bc4debe5eac35eab629a2b07ea9a1fbac68ad53bcea59fcc4b45
      # The Antigravity CLI's own installer only installs the latest: the release is pinned by its
      # URL (from https://antigravity-cli-auto-updater-974169037036.us-central1.run.app/manifests/darwin_arm64.json)
      # and that manifest's SHA-512.
      AGY_VERSION: 1.5.3
      AGY_URL: https://storage.googleapis.com/antigravity-public/antigravity-cli/1.5.3-6604829099950080/darwin-arm/cli_mac_arm64.tar.gz
      AGY_SHA512: 3215656cfe5336bce310365f61de7c85b4946a14de506747837106dfaf948dcff303c47e648e06fbbb73a8702538eae171e675f2910e4f49b280549018b46e95
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --frozen
      - name: Install the agents
        run: |
          node --version
          npm install --no-fund --no-audit --prefix "$RUNNER_TEMP/agents" \
            "@openai/codex@$CODEX_VERSION" "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION" \
            "@earendil-works/pi-coding-agent@$PI_VERSION"
          echo "$RUNNER_TEMP/agents/node_modules/.bin" >> "$GITHUB_PATH"
          curl -fsSL -o "$RUNNER_TEMP/agy.tar.gz" "$AGY_URL"
          echo "$AGY_SHA512  $RUNNER_TEMP/agy.tar.gz" | shasum -a 512 -c -
          mkdir -p "$RUNNER_TEMP/agy"
          tar -xzf "$RUNNER_TEMP/agy.tar.gz" -C "$RUNNER_TEMP/agy"
          mv "$RUNNER_TEMP/agy/antigravity" "$RUNNER_TEMP/agy/agy"
          echo "$RUNNER_TEMP/agy" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/agy/agy" --version | grep -qx "$AGY_VERSION"
          curl -fsSL -o "$RUNNER_TEMP/opencode.zip" \
            "https://github.com/anomalyco/opencode/releases/download/v$OPENCODE_VERSION/opencode-darwin-arm64.zip"
          echo "$OPENCODE_SHA256  $RUNNER_TEMP/opencode.zip" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/opencode"
          unzip -q "$RUNNER_TEMP/opencode.zip" -d "$RUNNER_TEMP/opencode"
          echo "$RUNNER_TEMP/opencode" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/opencode/opencode" --version | grep -q "$OPENCODE_VERSION"
      - run: e2e/ci.sh

  mac-app:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      # The whole app with its bundled engine, signed ad-hoc: catches bundling breakage on every change.
      - run: ./build-app.sh
        working-directory: mac
      - run: build/Keepmum.app/Contents/Resources/keepmum --help
        working-directory: mac
