name: Agents (latest)

# Daily: the e2e suite (e2e/ci.sh) against the newest Codex, Claude Code, Antigravity CLI, pi and opencode, not the
# versions ci.yml pins. An agent update can change how it calls tools (Codex 0.147 moved every command into a
# JavaScript `exec` tool) and keepmum must follow. This fails on the day such an update ships: a
# case that breaks, or a tool the agent now offers that e2e/tools.toml does not list. A failed
# scheduled run is emailed to whoever last changed this schedule. To move to the new versions, run
# the suite with them, fix what it finds, and raise the pins in ci.yml.
on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_PYTHON: "3.15"

jobs:
  latest:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --frozen
      - name: Install the newest agents
        run: |
          # Ubuntu 24.04 keeps unprivileged user namespaces from bubblewrap unless this is off.
          sudo apt-get install -y -qq bubblewrap socat
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          npm install --no-fund --no-audit --prefix "$RUNNER_TEMP/agents" @openai/codex@latest @anthropic-ai/claude-code@latest \
            @earendil-works/pi-coding-agent@latest
          echo "$RUNNER_TEMP/agents/node_modules/.bin" >> "$GITHUB_PATH"
          # The Antigravity CLI as its installer gets it (the newest release in its manifest, checked
          # against the manifest's SHA-512), without the installer's shell-profile changes.
          manifest="$(curl -fsSL --retry 5 --retry-all-errors https://antigravity-cli-auto-updater-974169037036.us-central1.run.app/manifests/linux_arm64.json)"
          field() { printf '%s' "$manifest" | python3 -c "import json, sys; print(json.load(sys.stdin)['$1'])"; }
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/agy.tar.gz" "$(field url)"
          echo "$(field sha512)  $RUNNER_TEMP/agy.tar.gz" | sha512sum -c -
          mkdir -p "$RUNNER_TEMP/agy"
          tar -xzf "$RUNNER_TEMP/agy.tar.gz" -C "$RUNNER_TEMP/agy"
          mv "$RUNNER_TEMP/agy/antigravity" "$RUNNER_TEMP/agy/agy"
          echo "$RUNNER_TEMP/agy" >> "$GITHUB_PATH"
          # opencode 2.x from its newest GitHub release (not on npm), checked against GitHub's digest.
          gh release download --repo anomalyco/opencode --pattern opencode-linux-arm64.tar.gz --dir "$RUNNER_TEMP"
          digest="$(gh release view --repo anomalyco/opencode --json assets \
            --jq '.assets[] | select(.name=="opencode-linux-arm64.tar.gz") | .digest' | sed 's/^sha256://')"
          echo "$digest  $RUNNER_TEMP/opencode-linux-arm64.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/opencode"
          tar -xzf "$RUNNER_TEMP/opencode-linux-arm64.tar.gz" -C "$RUNNER_TEMP/opencode"
          echo "$RUNNER_TEMP/opencode" >> "$GITHUB_PATH"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Compare with the pinned versions
        run: |
          {
            echo "## Agent versions"
            echo
            echo "| Agent | Newest | Pinned in ci.yml |"
            echo "|---|---|---|"
            echo "| Codex | $(codex --version | awk '{print $NF}') | $(sed -n 's/.*CODEX_VERSION: //p' .github/workflows/ci.yml) |"
            echo "| Claude Code | $(claude --version | awk '{print $1}') | $(sed -n 's/.*CLAUDE_CODE_VERSION: //p' .github/workflows/ci.yml) |"
            echo "| Antigravity CLI | $(agy --version) | $(sed -n 's/.*AGY_VERSION: //p' .github/workflows/ci.yml) |"
            echo "| pi | $(pi --version) | $(sed -n 's/.*PI_VERSION: //p' .github/workflows/ci.yml) |"
            echo "| opencode | $(opencode --version | awk '{print $NF}') | $(sed -n 's/.*OPENCODE_VERSION: //p' .github/workflows/ci.yml) |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
      - run: e2e/ci.sh
