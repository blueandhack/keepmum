[project]
name = "keepmum"
version = "0.1.0a11"
description = "Local secret and PII redaction proxy for Claude Code"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "typer>=0.12",
    "starlette>=0.45",
    "uvicorn>=0.32",
    "httpx>=0.28",
    "zstandard>=0.23",  # Codex and pi send zstd-compressed request bodies
]

[project.scripts]
keepmum = "keepmum.cli:app"
# For editors that launch Claude Code through a wrapper (VS Code: claudeCode.claudeProcessWrapper).
keepmum-claude-wrapper = "keepmum.launch:wrap_main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3.6",
    "faker>=30",
    "coverage>=7.10",
]
# The DMG's window: background, icon places, volume icon, without scripting Finder (mac/make-dmg.sh).
release = [
    "dmgbuild==1.6.7",
]
# Benchmark comparisons only (bench/): `uv sync --group mlx`, `--group torch`, `--group afm`.
# OpenAI Privacy Filter on MLX or PyTorch/MPS, compared with pf-serve (the runtime).
mlx = [
    "mlx>=0.31",
    "mlx-lm>=0.28",  # imported by mlx-embeddings' privacy-filter model; runs the Qwen judge experiment
    "mlx-embeddings @ git+https://github.com/Blaizzy/mlx-embeddings@9b28270be81211f2b8daed0041aec65ea5dc4b28",  # privacy-filter support is unreleased (PyPI 0.1.0 lacks it)
    "numpy>=2.0",
    "tokenizers>=0.21",
    "huggingface-hub>=0.25",
]
torch = [
    "torch>=2.9",
    "transformers>=5.6",
    "numpy>=2.0",
]
# ZeroLeaks' int8 ONNX of Shield Small, for bench/shield_parity.py and bench/guard.py's shield-small
# (keepmum itself runs the GGUF in llama-server).
onnx = [
    "onnxruntime>=1.21",
    "tokenizers>=0.21",
    "numpy>=2.0",
]
# The Apple on-device model through its Python SDK (dropped from v1).
afm = [
    "apple-fm-sdk>=0.2.1",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

# The tests run in parallel, a worker per core (pytest-xdist): about 5 s on an M5 Pro, 24 s one at a
# time. `pytest -n 0` runs them one at a time (for pdb, or a test's own output).
[tool.pytest.ini_options]
addopts = "-n auto"

# CI fails below fail_under (.github/workflows/ci.yml): statements and branches over the engine.
# The parallel test workers are processes of their own: coverage measures each (patch: subprocess)
# into a data file of its own, and `coverage combine` joins them before the report.
[tool.coverage.run]
branch = true
source = ["src/keepmum"]
patch = ["subprocess"]
parallel = true
# Measured, a child process would say on stderr that sys.monitoring cannot do branches before
# Python 3.14 (CI's COVERAGE_CORE=sysmon on an older Python), and fail tests that check stderr.
disable_warnings = ["no-sysmon"]

[tool.coverage.report]
fail_under = 95
skip_covered = true
show_missing = true
